<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afrika Topographie Lernspiel</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b1020;
        color: #e6edf7;
      }
      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.45rem;
      }
      p {
        margin: 0.25rem 0 1rem;
        color: #a7b4ca;
      }
      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 1rem;
      }
      .panel,
      .map-wrap {
        border: 1px solid #22314e;
        border-radius: 14px;
        background: #111a2d;
      }
      .panel {
        padding: 0.9rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .chip {
        border: 1px solid #33507a;
        background: #17263f;
        color: #dbe8ff;
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        cursor: grab;
        user-select: none;
      }
      .chip:active { cursor: grabbing; }
      .map-wrap {
        position: relative;
        min-height: 620px;
        overflow: hidden;
      }
      .map-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
        background: radial-gradient(circle at 45% 35%, #1b2e52, #0e1630 62%);
      }
      .drop-hint {
        position: absolute;
        inset: auto 0.8rem 0.8rem auto;
        font-size: 0.82rem;
        color: #a7b4ca;
        background: #0d162b;
        border: 1px solid #243963;
        padding: 0.4rem 0.55rem;
        border-radius: 8px;
      }
      .placed {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 1px solid #2d79ff;
        background: rgba(27, 92, 214, 0.25);
        color: #dfe9ff;
        border-radius: 999px;
        padding: 0.2rem 0.5rem;
        font-size: 0.8rem;
        pointer-events: none;
      }
      .legend {
        margin-top: 0.8rem;
        font-size: 0.85rem;
        color: #95a5c4;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .map-wrap {
          min-height: 540px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Afrika Topographie Lernspiel</h1>
      <p>
        Ziehe Länder aus der Liste auf die Karte. Diese Datei ist jetzt reines HTML/CSS/JS und
        rendert ohne React/TypeScript-Fehler.
      </p>

      <section class="layout">
        <aside class="panel" aria-label="Länderliste">
          <h2 style="font-size:1rem;margin:0 0 .65rem;">Länder</h2>
          <div class="chips" id="country-list"></div>
          <div class="legend">
            <strong>Tipp:</strong> Du kannst ein Land mehrfach ziehen, um seine Position zu
            korrigieren.
          </div>
        </aside>

        <section class="map-wrap" id="map" aria-label="Afrika Karte" tabindex="0">
          <svg viewBox="0 0 512 512" role="img" aria-label="Afrika Umriss">
            <path
              d="M263.1,474.6L255.7,469.6L254.5,471.1L253.2,470.0L253.8,465.9L249.9,462.3L252.9,458.5L252.6,453.5L244.3,435.4L237.8,428.3L234.9,421.0L231.3,404.4L231.6,394.9L216.2,367.7L216.2,354.7L220.7,340.5L227.5,332.9L227.8,326.7L223.0,316.3L225.7,312.8L219.2,300.0L218.6,295.0L204.4,278.8L199.4,269.6L202.3,267.2L204.1,260.1L202.9,257.2L206.5,247.1L204.1,243.9L198.4,239.9L185.1,241.7L177.4,231.0L171.5,229.0L153.1,233.1L140.4,239.0L126.2,236.0L107.3,241.4L98.7,236.9L85.7,226.3L78.6,223.3L74.3,209.6L68.6,206.8L63.7,202.2L63.3,199.1L59.1,198.5L56.0,194.8L57.2,188.0L52.5,181.2L57.2,175.6L60.2,160.2L57.2,154.3L59.3,149.0L54.8,143.7L55.4,138.1L67.0,121.5L69.3,112.0L74.3,108.5L76.7,102.3L85.7,98.6L95.6,88.7L95.0,79.5L98.6,70.7L103.8,65.5L112.8,60.6L116.6,50.3L120.6,47.2L125.0,52.8L134.8,51.6L140.1,53.7L145.7,48.9L150.5,48.3L159.0,43.0L174.7,40.4L181.8,42.4L186.8,39.5L190.4,40.9L193.3,39.5L195.7,41.2L206.3,37.7L210.2,41.5L213.1,39.5L214.2,40.5L210.6,46.7L214.5,53.8L208.0,60.9L209.3,62.8L213.4,63.1L214.9,66.1L220.8,69.0L227.0,68.4L236.5,71.4L239.4,77.9L247.4,79.7L257.5,85.6L260.1,85.3L263.5,81.3L262.7,74.2L272.3,68.1L279.6,69.3L282.3,73.2L291.2,74.1L293.2,77.6L298.0,76.7L313.9,81.7L325.2,76.7L330.5,77.3L334.6,80.3L343.5,79.1L348.1,91.3L344.8,102.9L343.5,103.9L340.8,101.8L340.4,103.5L352.8,126.2L352.5,132.4L359.3,137.8L362.3,156.7L370.0,163.8L373.8,175.9L382.5,180.8L394.2,192.7L395.7,196.9L393.6,198.7L400.6,205.3L407.6,202.6L412.4,203.5L417.1,200.6L426.0,200.6L433.7,198.5L435.7,196.1L440.0,197.8L437.7,211.7L422.0,238.9L410.6,251.4L394.2,263.1L385.0,274.9L378.2,280.5L372.0,291.8L370.0,299.2L374.1,304.5L372.6,312.5L375.3,321.0L379.7,324.6L379.1,338.5L381.2,348.8L373.1,360.8L360.4,366.7L355.0,373.5L346.9,379.6L346.3,381.9L351.3,392.6L351.0,404.7L347.3,408.7L335.4,414.7L336.6,421.8L333.6,432.2L326.8,438.7L321.2,449.0L303.6,465.4L296.5,466.6L290.6,470.2L278.2,468.7Z"
              fill="#213459"
              stroke="#9db2da"
              stroke-width="3"
            />
          </svg>
          <span class="drop-hint">Auf die Karte ziehen & ablegen</span>
        </section>
      </section>
    </main>

    <script>
      const countries = [
        "Marokko", "Algerien", "Tunesien", "Libyen", "Ägypten", "Senegal", "Mali",
        "Elfenbeinküste", "Ghana", "Nigeria", "Kamerun", "Gabun", "Republik Kongo",
        "DR Kongo", "Äthiopien", "Somalia", "Kenia", "Tansania", "Namibia",
        "Botswana", "Simbabwe", "Südafrika"
      ];

      const list = document.getElementById("country-list");
      const map = document.getElementById("map");
      const placements = new Map();

      function renderCountryList() {
        list.innerHTML = "";
        for (const name of countries) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip";
          button.draggable = true;
          button.textContent = name;
          button.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", name);
            e.dataTransfer.effectAllowed = "copy";
          });
          list.appendChild(button);
        }
      }

      function drawPlacements() {
        map.querySelectorAll(".placed").forEach((n) => n.remove());
        for (const [name, pos] of placements.entries()) {
          const tag = document.createElement("div");
          tag.className = "placed";
          tag.textContent = name;
          tag.style.left = `${pos.x}px`;
          tag.style.top = `${pos.y}px`;
          map.appendChild(tag);
        }
      }

      map.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });

      map.addEventListener("drop", (e) => {
        e.preventDefault();
        const name = e.dataTransfer.getData("text/plain");
        if (!name) return;

        const rect = map.getBoundingClientRect();
        const x = Math.max(16, Math.min(rect.width - 16, e.clientX - rect.left));
        const y = Math.max(16, Math.min(rect.height - 16, e.clientY - rect.top));
        placements.set(name, { x, y });
        drawPlacements();
      });

      renderCountryList();
    </script>
  </body>
</html>
